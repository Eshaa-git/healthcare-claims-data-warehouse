# Machine-readable file contracts for CMS DE-SynPUF Sample 1 (generated from real headers, then annotated).
# All source values are read as text. Identifiers and diagnosis/procedure/NDC codes stay strings
# (leading zeros matter). Dates are YYYYMMDD. Money is parsed as exact decimal with two places.
# Negative CLM_PMT_AMT is valid: the DE-SynPUF codebook (IP-7, OP-7) documents negative claim payments
# when the deductible or coinsurance exceeds the Medicare payment. Segment 2 claim rows carry no dates;
# they inherit dates from segment 1 of the same CLM_ID.
contract_version: 1
datasets:
  beneficiary_summary:
    columns: [DESYNPUF_ID, BENE_BIRTH_DT, BENE_DEATH_DT, BENE_SEX_IDENT_CD, BENE_RACE_CD, BENE_ESRD_IND, SP_STATE_CODE, BENE_COUNTY_CD, BENE_HI_CVRAGE_TOT_MONS, BENE_SMI_CVRAGE_TOT_MONS, BENE_HMO_CVRAGE_TOT_MONS, PLAN_CVRG_MOS_NUM, SP_ALZHDMTA, SP_CHF, SP_CHRNKIDN, SP_CNCR, SP_COPD, SP_DEPRESSN, SP_DIABETES, SP_ISCHMCHT, SP_OSTEOPRS, SP_RA_OA, SP_STRKETIA, MEDREIMB_IP, BENRES_IP, PPPYMT_IP, MEDREIMB_OP, BENRES_OP, PPPYMT_OP, MEDREIMB_CAR, BENRES_CAR, PPPYMT_CAR]
    key: [DESYNPUF_ID, SOURCE_YEAR]
    required: [DESYNPUF_ID, BENE_BIRTH_DT, BENE_SEX_IDENT_CD]
    dates: [BENE_BIRTH_DT, BENE_DEATH_DT]
    money: [MEDREIMB_IP, BENRES_IP, PPPYMT_IP, MEDREIMB_OP, BENRES_OP, PPPYMT_OP, MEDREIMB_CAR, BENRES_CAR, PPPYMT_CAR]
    integers: [BENE_HI_CVRAGE_TOT_MONS, BENE_SMI_CVRAGE_TOT_MONS, BENE_HMO_CVRAGE_TOT_MONS, PLAN_CVRG_MOS_NUM]
    allowed_codes:
      BENE_SEX_IDENT_CD: ["1", "2"]
      BENE_ESRD_IND: ["0", "Y"]
      SP_ALZHDMTA: ["1", "2"]
      SP_CHF: ["1", "2"]
      SP_CHRNKIDN: ["1", "2"]
      SP_CNCR: ["1", "2"]
      SP_COPD: ["1", "2"]
      SP_DEPRESSN: ["1", "2"]
      SP_DIABETES: ["1", "2"]
      SP_ISCHMCHT: ["1", "2"]
      SP_OSTEOPRS: ["1", "2"]
      SP_RA_OA: ["1", "2"]
      SP_STRKETIA: ["1", "2"]
    preserve_as_string: [DESYNPUF_ID, BENE_RACE_CD, SP_STATE_CODE, BENE_COUNTY_CD]
  inpatient_claims:
    columns: [DESYNPUF_ID, CLM_ID, SEGMENT, CLM_FROM_DT, CLM_THRU_DT, PRVDR_NUM, CLM_PMT_AMT, NCH_PRMRY_PYR_CLM_PD_AMT, AT_PHYSN_NPI, OP_PHYSN_NPI, OT_PHYSN_NPI, CLM_ADMSN_DT, ADMTNG_ICD9_DGNS_CD, CLM_PASS_THRU_PER_DIEM_AMT, NCH_BENE_IP_DDCTBL_AMT, NCH_BENE_PTA_COINSRNC_LBLTY_AM, NCH_BENE_BLOOD_DDCTBL_LBLTY_AM, CLM_UTLZTN_DAY_CNT, NCH_BENE_DSCHRG_DT, CLM_DRG_CD, ICD9_DGNS_CD_1, ICD9_DGNS_CD_2, ICD9_DGNS_CD_3, ICD9_DGNS_CD_4, ICD9_DGNS_CD_5, ICD9_DGNS_CD_6, ICD9_DGNS_CD_7, ICD9_DGNS_CD_8, ICD9_DGNS_CD_9, ICD9_DGNS_CD_10, ICD9_PRCDR_CD_1, ICD9_PRCDR_CD_2, ICD9_PRCDR_CD_3, ICD9_PRCDR_CD_4, ICD9_PRCDR_CD_5, ICD9_PRCDR_CD_6, HCPCS_CD_1, HCPCS_CD_2, HCPCS_CD_3, HCPCS_CD_4, HCPCS_CD_5, HCPCS_CD_6, HCPCS_CD_7, HCPCS_CD_8, HCPCS_CD_9, HCPCS_CD_10, HCPCS_CD_11, HCPCS_CD_12, HCPCS_CD_13, HCPCS_CD_14, HCPCS_CD_15, HCPCS_CD_16, HCPCS_CD_17, HCPCS_CD_18, HCPCS_CD_19, HCPCS_CD_20, HCPCS_CD_21, HCPCS_CD_22, HCPCS_CD_23, HCPCS_CD_24, HCPCS_CD_25, HCPCS_CD_26, HCPCS_CD_27, HCPCS_CD_28, HCPCS_CD_29, HCPCS_CD_30, HCPCS_CD_31, HCPCS_CD_32, HCPCS_CD_33, HCPCS_CD_34, HCPCS_CD_35, HCPCS_CD_36, HCPCS_CD_37, HCPCS_CD_38, HCPCS_CD_39, HCPCS_CD_40, HCPCS_CD_41, HCPCS_CD_42, HCPCS_CD_43, HCPCS_CD_44, HCPCS_CD_45]
    key: [CLM_ID, SEGMENT]
    required: [DESYNPUF_ID, CLM_ID, SEGMENT, CLM_PMT_AMT]
