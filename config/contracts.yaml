    required: [DESYNPUF_ID, PDE_ID, SRVC_DT, TOT_RX_CST_AMT, PTNT_PAY_AMT]
    dates: [SRVC_DT]
    money: [PTNT_PAY_AMT, TOT_RX_CST_AMT]
    integers: [DAYS_SUPLY_NUM]
    decimals: [QTY_DSPNSD_NUM]
    preserve_as_string: [DESYNPUF_ID, PDE_ID, PROD_SRVC_ID]
