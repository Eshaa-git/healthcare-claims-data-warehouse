name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint, unit, integration and fixture pipeline
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: warehouse_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: claims_warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse_admin -d claims_warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WAREHOUSE_HOST: 127.0.0.1
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: claims_warehouse
      WAREHOUSE_ADMIN_USER: warehouse_admin
      WAREHOUSE_ADMIN_PASSWORD: ci-admin-password
      LOADER_PASSWORD: ci-loader-password
      TRANSFORMER_PASSWORD: ci-transformer-password
      DASHBOARD_PASSWORD: ci-dashboard-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.23"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests dags app scripts
          uv run ruff format --check src tests dags app scripts
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Integration and recovery tests (fixture data, test database)
        run: uv run pytest tests/integration
      - name: Full fixture pipeline through the CLI
        env:
          CLAIMS_DW_SOURCE: fixture
          DATA_DIR: ${{ runner.temp }}/claims-data
        run: |
          uv run claims-dw migrate
          uv run claims-dw pipeline --run-id ci-${{ github.run_id }}
          uv run claims-dw report --run-id ci-${{ github.run_id }}
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

  image:
    name: build image and check DAG imports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.23"
      - name: Verify requirements.lock.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -q -o /tmp/req.txt
          diff -u requirements.lock.txt /tmp/req.txt
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: claims-dw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: DAG parses without import errors
        run: docker run --rm --entrypoint python claims-dw:ci /opt/claims-dw/scripts/check_dag.py
