name: claims-dw

x-warehouse-env: &warehouse-env
  WAREHOUSE_HOST: warehouse-db
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DB: ${WAREHOUSE_DB:-claims_warehouse}
  WAREHOUSE_ADMIN_USER: ${WAREHOUSE_ADMIN_USER:-warehouse_admin}
  WAREHOUSE_ADMIN_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:?set WAREHOUSE_ADMIN_PASSWORD in .env}
  LOADER_PASSWORD: ${LOADER_PASSWORD:?set LOADER_PASSWORD in .env}
  TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD:?set TRANSFORMER_PASSWORD in .env}
  DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
  CLAIMS_DW_SOURCE: ${CLAIMS_DW_SOURCE:-cms}
  COHORT_SIZE: ${COHORT_SIZE:-1000}
  DATA_DIR: /opt/claims-dw/data
  CLAIMS_DW_HOST_LABEL: ${CLAIMS_DW_HOST_LABEL:-}
  CLAIMS_DW_GIT_COMMIT: ${CLAIMS_DW_GIT_COMMIT:-}

services:
  warehouse-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-claims_warehouse}
      POSTGRES_USER: ${WAREHOUSE_ADMIN_USER:-warehouse_admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:?set WAREHOUSE_ADMIN_PASSWORD in .env}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${WAREHOUSE_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow:
    build: .
    image: claims-dw:local
    command: standalone
    environment:
      <<: *warehouse-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # Start each task in a fresh interpreter instead of fork(): the scheduler is multi-threaded and
      # a forked task stalled ~15 min in its first API call during an early recorded run.
      AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "true"
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/opt/claims-dw/data
      - ./reports:/opt/claims-dw/reports
      - airflow-logs:/opt/airflow/logs
    depends_on:
      warehouse-db:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  dashboard:
    image: claims-dw:local
    entrypoint: ["/opt/claims-dw/venv/bin/streamlit"]
    command:
      - run
      - /opt/claims-dw/app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --client.toolbarMode=viewer
    environment:
      WAREHOUSE_HOST: warehouse-db
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-claims_warehouse}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8501}:8501"
    depends_on:
      airflow:
        condition: service_started
      warehouse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  warehouse-data:
  airflow-db-data:
  airflow-logs:
